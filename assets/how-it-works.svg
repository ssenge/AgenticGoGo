<text x="1214" y="464" fill="#c9d1d9" font-size="17" font-weight="600" font-family="SFMono-Regular,Menlo,Consolas,monospace" text-anchor="start">agg spawn</text>
<text x="1214" y="485" fill="#8b949e" font-size="13" font-weight="400" font-family="-apple-system,Segoe UI,Roboto,sans-serif" text-anchor="start">track long side-tasks across sessions</text>

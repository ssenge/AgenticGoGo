<!doctype html><meta charset="utf-8">
<style>
:root{--agent:#2a9d8f;--verifier:#d63a46;--human:#f28c45;--engine:#264653;--ink:#1d2b33;--mute:#5b6b73}
*{box-sizing:border-box}
html,body{margin:0;background:#fff}
body{width:1500px;height:400px;position:relative;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;color:var(--ink)}
.b{position:absolute;border-radius:18px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:10px 16px;color:#fff}
.b h4{margin:0;font-size:30px;letter-spacing:.06em;font-weight:800}
.b p{margin:7px 0 0;font-size:19px;line-height:1.3}
.b small{display:block;margin-top:6px;font-size:16px;opacity:.9}
.mascot{position:absolute;left:30px;top:50px;width:210px;height:210px}
.cap{position:absolute;font-weight:800;text-align:center}
</style>

<img class="mascot" src="mark.png">
<div class="cap" style="left:30px;top:262px;width:210px;font-size:26px;letter-spacing:.04em;color:var(--engine)">Relentless</div>
<div class="cap" style="left:10px;top:296px;width:250px;font-size:16px;font-weight:600;color:var(--mute)">the agentic workflow engine</div>

<div class="b" style="left:330px;top:90px;width:330px;height:160px;background:var(--agent)"><h4>AGENTS</h4><p>do the work</p><small>Claude Code · Codex · Copilot · …</small></div>
<div class="b" style="left:770px;top:90px;width:330px;height:160px;background:var(--verifier)"><h4>VERIFIERS</h4><p>decide when it is done</p><small>agents can’t fool them</small></div>
<div class="b" style="left:1210px;top:90px;width:250px;height:160px;background:var(--engine)"><h4>✔ DONE</h4><p>only when it<br>is truly done</p></div>
<div class="b" style="left:1050px;top:292px;width:410px;height:56px;background:#fdf1e8;border:2.5px solid var(--human);border-radius:28px;color:#a8561a;padding:4px 14px"><p style="margin:0;font-size:19px;font-weight:700">👤 humans decide only where they must</p></div>

name: release

# Build per-platform `agg` binaries and attach them to the GitHub Release.
# Triggers when you push a version tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`).
# Free on public repos: GitHub Actions minutes are unlimited for public repositories.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}   # also runnable by hand from the Actions tab

permissions:
  contents: write          # needed to create/upload to the Release

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest        # Apple Silicon
          # Intel Mac: cross-compiled ON the Apple-Silicon runner (just add the target).
          # Avoids the scarce free-tier macos-13 runner queue that left v0.0.1's Intel
          # binary stuck. macos-latest can build both Apple targets.
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Linux: linked against glibc 2.17 by zig, so the binary runs on older hosts than the runner (Amazon Linux
      # 2023 has glibc 2.34; ubuntu-latest builds against 2.39, and `GLIBC_2.3x not found` was the result).
      # The output path and the asset's name stay those of the plain target.
      - name: Install zig and cargo-zigbuild (linux)
        if: runner.os == 'Linux'
        run: |
          python3 -m pip install --user ziglang cargo-zigbuild
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build release binary (linux, glibc 2.17)
        if: runner.os == 'Linux'
        run: cargo zigbuild --release --target ${{ matrix.target }}.2.17 --bin agg

      - name: Build release binary
        if: runner.os != 'Linux'
        run: cargo build --release --target ${{ matrix.target }} --bin agg

      # Name the artifact after the target so each platform asset is distinct.
      - name: Stage artifact (unix)
        if: runner.os != 'Windows'
        run: |
          cp "target/${{ matrix.target }}/release/agg" "agg-${{ matrix.target }}"
          chmod +x "agg-${{ matrix.target }}"

      - name: Stage artifact (windows)
        if: runner.os == 'Windows'
        run: cp "target/${{ matrix.target }}/release/agg.exe" "agg-${{ matrix.target }}.exe"

      - name: Upload to the Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            agg-${{ matrix.target }}
            agg-${{ matrix.target }}.exe
          fail_on_unmatched_files: false

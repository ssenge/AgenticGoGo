name: ci

# The gate ROADMAP.md describes, run automatically on every push/PR (not just by hand at release
# time): the full test suite + clippy + fmt on unix, plus a Windows cross-check. Free on public
# repos. The integration tests (tests/cli.rs) are #![cfg(unix)] — they put a fake `claude` shell
# stub on PATH — so the full `cargo test` runs on ubuntu + macos; Windows gets `cargo check`
# (matching what release.yml ships and what ROADMAP:168 promises).
on:
  push:
    branches: ["**"]
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ci-${{ matrix.os }}
      # No `cargo fmt --check`: the codebase uses a deliberate hand-formatting style (compact
      # struct literals, single-line guards) that default rustfmt would rewrite wholesale.
      # Clippy (with -D warnings) + the test suite are the enforced quality gates.
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all

  windows-check:
    name: windows cross-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain (+ windows target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ci-windows-check
      # `cargo check` doesn't link, so the MSVC target compiles cleanly on ubuntu — no Windows
      # runner needed. Catches the portability regressions release.yml's Windows binary would hit.
      - name: Check windows target
        run: cargo check --target x86_64-pc-windows-msvc

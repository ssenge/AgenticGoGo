# p-vs-np — full-feature showcase. Every agg mechanism on one famous problem.
# A judge IS a goal, resolved by NAME from agg/judges/<name>.{sh,md}.
project: "p-vs-np"

# Inherited by EVERY step; a step body may override any of these.
defaults:
  agent: "claude"                        # the grunt worker runs on Claude/Opus. See the README to port.
  model: "claude-opus-4-8[1m]"           # the heavy lifting runs on Opus
  effort: "max"                          # highest thinking effort — this is a HARD problem. `max` is Claude's
                                         # headless ceiling; the `reconsider` step below runs on codex, which
                                         # clamps `max`→`high` (its own ceiling). See docs/CONFIG.md.
  state: "state/STATE.md"                # worker-curated forward advice; under gitignored agg/state/, survives a rollback

# THE RULER — runs the LLM judge (paper_written) + the summarizer. Immutable across the run:
# a grader that moves makes verdicts incomparable across cycles.
judge:
  agent: "claude"
  model: "claude-haiku-4-5-20251001"     # a cheap model grades the paper; the worker stays on Opus
  timeout: 1800                          # Lean builds are slow — every judge gets 30 min

# The step palette. Two steps: the grunt worker, and a vendor-diverse `reconsider` (the headline).
steps:
  worker: {}                             # pure defaults — Opus does the proof work

  # THE PERSPECTIVE-DIVERSITY STEP. When the run stalls, step back on a DIFFERENT VENDOR — a Claude
  # rabbit hole is not necessarily a Codex rabbit hole. skip_judges ⇒ nothing merges; the work stages
  # and the next worker step gates it. (Swap `codex` for any installed agent; run `agg doctor` first.)
  reconsider:
    agent: "codex"
    prompt: >
      Assume the current proof strategy is a dead end. Name 2-3 fundamentally different lemma
      routes, pick the most promising, and write the rejected routes and WHY they fail into your
      scratch note — agg will persist them so no future session repeats them.
    skip_judges: true

# The repeating sequence + the run-level ceilings and Definition of Done.
sequence:
  steps:
    # up to four grunt sessions on Opus — but the repeat ENDS EARLY the moment progress resumes…
    - { step: worker, until: "NOT stalled", max: 4 }
    # …so `reconsider` is reached only when all four stayed flat: step back on Codex. There is no
    # `if:` in a sequence entry (the Rust driver API owns conditional flow); a converging `until:`
    # repeat falling through to the next entry is how a recovery step stays conditional here.
    - reconsider
  limits: { tokens: 50000000 }           # output-token ceiling → over_budget. A hopeless run can't run forever.
                                         # NOTE: no `cost` here — it is Claude-only, and this sequence
                                         # names a `codex` step, so a dollar guard could never cover the
                                         # whole run. `limits.tokens` works on every agent. See the README.
  invariants: ["no_sorry"]               # the soundness guard must STAY met — the gate protects it
  done_if: "proof_verified AND paper_written"        # the prize (don't hold your breath)
  abort_if: "any_regressed(invariants) OR over_budget"   # bail on a smuggled gap or the token ceiling

hooks:
  on_start: ["lake build || true"]       # fetch/build the Lean project + Mathlib once (agg stays tool-agnostic)
summary: { enabled: true }               # rolling progress digests (runs on the ruler)

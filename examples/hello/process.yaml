# The smallest process: one agent step with a check and a review, then a checkpoint where a human decides.
# Run it:   rlt process examples/hello/process.yaml <project>        (the project is a git repo holding task.md)
# Try it without tokens: see examples/hello/README.md (a scenario plays scripted agents).
version: 1
roles: { file: tools.yaml }          # in the project: which agent works, which one reviews
run:
  history: reports/steps.jsonl       # the record of every step (default: rlt/private/steps.jsonl, which git ignores)
  own: [task.md, tools.yaml, reports/steps.jsonl]   # files a reset never takes back
phases:
- id: build
  name: Build
  steps:
  - id: fix
    name: Fix add
    kind: agent
    review: true                       # a second agent grades the result against verifiers/fix-review.md
    checks: [verifiers/tests.sh]       # a script verifier: its last line is {"met": …, "rationale": …}
    settings: { inputs: [task.md, cp-fix-decisions.md], outputs: [add.py] }
  - id: cp-fix
    name: Fix approved
    kind: checkpoint
    doc: add.py                        # what the human reads
    question: "{{ cp.cp-fix }}: approve {{ step.fix }}?"
    owner: fix

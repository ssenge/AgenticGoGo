# Hooks: scripts before and after every step and every phase (docs/PROCESS.md). The process's own, here; a project's go
# in the file `run.hooks.project` names, in the project.
step:
  after: [verifiers/hook.sh]
steps:
  survey: { after: [{ verifier: worked }] }   # a declared verifier as a hook
phases:
  build: { before: [verifiers/phase-hook.sh before], after: [verifiers/phase-hook.sh after] }

# Hooks: scripts before and after every step and every phase (docs/PROCESS.md). The process's own, here; a project's go
# in the file `run.hooks.project` names, in the project.
step:
  after: [judges/hook.sh]
steps:
  survey: { after: [{ judge: worked }] }   # a declared judge as a hook
phases:
  build: { before: [judges/phase-hook.sh before], after: [judges/phase-hook.sh after] }

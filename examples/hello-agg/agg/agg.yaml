# agg.yaml — harness + steps + sequence, all in one file. A judge IS a goal, resolved by NAME
# from agg/judges/<name>.{sh,md} (then ~/.agg/judges/).
project: "hello-agg"

# Inherited by EVERY step; a step body may override any of these.
defaults:
  agent: "claude"                    # swap to `codex` or `copilot` — see "Run it on another agent"
  model: "claude-haiku-4-5-20251001" # haiku — costs next to nothing to try
  state: "state/STATE.md"            # worker-curated forward advice; under gitignored agg/state/ (created at runtime)

# THE RULER — runs the LLM judges + the summarizer. Immutable across the run.
judge:
  agent: "claude"
  model: "claude-haiku-4-5-20251001"
  timeout: 300                     # seconds, EVERY judge (script + LLM)

# The step palette. The NAME is your own label; the body is overrides only.
steps:
  worker: {}                       # pure defaults — one plain worker step

# The repeating sequence + the run-level Definition of Done.
sequence:
  steps:
    - "worker"                     # run `worker`, forever, until done_if fires
  done_if: "prints_two"            # your Definition of Done: the `prints_two` judge is met
  abort_if: "over_iterations OR wall_hours >= 1"   # a ceiling, not part of the DoD
  # ASK FOR HELP WITHOUT STOPPING. `notify_if` is the non-terminal twin of `abort_if`: when it is
  # true agg runs `notify.cmd` and the loop KEEPS RUNNING. `stalled` is a judge that ships inside
  # the binary (it reads agg/state/verdicts.jsonl), so this runs as-is — nothing to author.
  # `stalled` is safe HERE because the sequence above has no `if stalled then …` branch: name one
  # detector in both and you get paged a cycle BEFORE the recovery step runs (docs/CONFIG.md, "the
  # escalation ladder"). A real setup would `curl` a push service — and would bound it
  # (`curl --max-time 10`), since delivery is foreground; a local append keeps the example offline.
  notify_if: "stalled"
  notify:
    cooldown_sessions: 3           # at most one ping per 3 sessions — don't nag (default 3; 0 = every cycle)
    # {{reason}} is the firing judge's rationale; agg shell-quotes every {{…}}, so DON'T quote it
    # yourself. {{project}} / {{session}} / {{step}} are available too.
    cmd: ["echo session {{session}}: {{reason}} >> agg/state/NOTIFY.log"]

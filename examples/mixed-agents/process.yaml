# Mixed agents: the worker is a command agent (any CLI, described below), the reviewer is Claude.
# Run it:   rlt process examples/mixed-agents/process.yaml <project>   (the project is a git repo holding task.md)
# Try it without tokens: see examples/mixed-agents/README.md (a scenario plays the reviewer).
version: 1
rlt:
  agents:                            # a CLI of your own: `{brief_file}` holds the step's brief, `{workdir}` is the project
    shell-worker:
      command: [sh, "{workdir}/agents/worker.sh", "{brief_file}"]
      output: text                   # each output line is shown; the exit code decides success
roles: { file: tools.yaml }          # in the project: which agent works, which one reviews
run:
  history: reports/steps.jsonl       # the record of every step (default: rlt/private/steps.jsonl, which git ignores)
  own: [task.md, tools.yaml, reports/steps.jsonl]   # files a reset never takes back
phases:
- id: build
  name: Build
  steps:
  - id: fix
    name: Fix add
    kind: agent
    review: true                       # a second agent grades the result against verifiers/fix-review.md
    checks: [verifiers/tests.sh]       # a script verifier: its last line is {"met": …, "rationale": …}
    settings: { inputs: [task.md, cp-fix-decisions.md], outputs: [add.py] }
  - id: cp-fix
    name: Fix approved
    kind: checkpoint
    doc: add.py                        # what the human reads
    question: "{{ cp.cp-fix }}: approve {{ step.fix }}?"
    owner: fix

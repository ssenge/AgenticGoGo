# One session on another machine: a one-item `each` with `parallel: { max: 1, target }`. Everything else is a process like any other.
# Check it:   rlt process examples/remote-session/process.yaml --check      (it needs a host to run: see README.md)
version: 1
rlt:
  agents:
    sleeper:
      command: [sh, "{workdir}/agents/worker.sh", "{brief_file}"]
      output: text
roles: { file: tools.yaml }
phases:
- id: build
  name: Build
  steps:
  - id: remote
    name: The work, on the build host
    kind: each
    items: { file: plan.yaml, items: units, key: id }
    parallel:
      max: 1
      target: { kind: ssh, host: build-box, user: deploy, dir: /srv/rlt, rlt: ~/.local/bin/rlt, pass_env: [ANTHROPIC_API_KEY] }
    steps:
    - id: make
      name: Make the unit
      kind: agent
      sections: [{ text: "ITEM={{ item }}" }]
      verifiers: [verifiers/made.sh]
